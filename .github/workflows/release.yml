# Builds the extension and attaches the zip to a GitHub release when a tag
# like v1.0 is pushed. The real-binary tests skip themselves here, since
# stabs.testBinaries isn't set.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GHIDRA_VERSION: "12.1.4"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "Ghidra_${GHIDRA_VERSION}_build" \
            --repo NationalSecurityAgency/ghidra \
            --pattern "ghidra_${GHIDRA_VERSION}_PUBLIC_*.zip" \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/ghidra_*.zip -d "$RUNNER_TEMP"
          echo "GHIDRA_INSTALL_DIR=$(echo "$RUNNER_TEMP"/ghidra_${GHIDRA_VERSION}_PUBLIC)" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew test buildExtension

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
